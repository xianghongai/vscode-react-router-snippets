name: Publish VS Code Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code quality
        run: |
          pnpm run format:check
          pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Verify package
        run: |
          ls -lh *.vsix
          pnpm dlx @vscode/vsce ls

      - name: Publish to VS Code Marketplace
        run: pnpm dlx @vscode/vsce publish --no-dependencies -p ${{ secrets.VS_MARKETPLACE_TOKEN }}
